<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Wiring the Shelly 1PM Gen4 header to a 3.3 V USB-UART adapter</title>
  <desc>Header pin 1 GND to adapter GND, pin 4 3V3 to adapter 3.3 V, pin 5 RX to adapter TX, pin 6 TX to adapter RX. Pins 1 and 2 bridged only for the first flash. Pins 3 and 7 unconnected.</desc>

  <!-- card background so it reads on light and dark GitHub themes -->
  <rect x="0" y="0" width="760" height="510" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="509" rx="14" fill="none" stroke="#d0d7de"/>

  <text x="30" y="40" font-size="20" font-weight="600" fill="#1f2328">Wiring for flashing</text>
  <text x="30" y="64" font-size="14" fill="#57606a">Shelly disconnected from mains. Adapter set to 3.3 V, never 5 V.</text>

  <!-- Shelly header -->
  <rect x="30" y="90" width="270" height="345" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="50" y="118" font-size="15" font-weight="600" fill="#1f2328">Shelly 7-pin header</text>
  <text x="50" y="137" font-size="12" fill="#57606a">1.27 mm pitch, same pinout as Plus 1PM</text>

  <g font-size="14" fill="#1f2328">
    <text x="50" y="175"><tspan font-weight="600">1</tspan>  GND</text>
    <text x="50" y="215"><tspan font-weight="600">2</tspan>  Boot strap</text>
    <text x="50" y="255" fill="#8c959f"><tspan font-weight="600">3</tspan>  EN (leave open)</text>
    <text x="50" y="295"><tspan font-weight="600">4</tspan>  3V3</text>
    <text x="50" y="335"><tspan font-weight="600">5</tspan>  RX</text>
    <text x="50" y="375"><tspan font-weight="600">6</tspan>  TX</text>
    <text x="50" y="415" fill="#8c959f"><tspan font-weight="600">7</tspan>  (leave open)</text>
  </g>
  <g fill="#1f2328">
    <circle cx="280" cy="170" r="6"/>
    <circle cx="280" cy="210" r="6"/>
    <circle cx="280" cy="250" r="6" fill="#8c959f"/>
    <circle cx="280" cy="290" r="6"/>
    <circle cx="280" cy="330" r="6"/>
    <circle cx="280" cy="370" r="6"/>
    <circle cx="280" cy="410" r="6" fill="#8c959f"/>
  </g>

  <!-- USB-UART adapter -->
  <rect x="490" y="90" width="240" height="345" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="510" y="118" font-size="15" font-weight="600" fill="#1f2328">USB-UART adapter</text>
  <text x="510" y="137" font-size="12" fill="#57606a">jumper on 3.3 V</text>
  <g font-size="14" fill="#1f2328" text-anchor="end">
    <text x="700" y="175">GND</text>
    <text x="700" y="295">3.3 V</text>
    <text x="700" y="335">RX</text>
    <text x="700" y="375">TX</text>
  </g>
  <g fill="#1f2328">
    <circle cx="510" cy="170" r="6"/>
    <circle cx="510" cy="290" r="6"/>
    <circle cx="510" cy="330" r="6"/>
    <circle cx="510" cy="370" r="6"/>
  </g>

  <!-- wires -->
  <line x1="286" y1="170" x2="504" y2="170" stroke="#24292f" stroke-width="3"/>
  <line x1="286" y1="290" x2="504" y2="290" stroke="#cf222e" stroke-width="3"/>
  <!-- data lines cross: header RX -> adapter TX, header TX -> adapter RX -->
  <line x1="286" y1="330" x2="504" y2="370" stroke="#1a7f37" stroke-width="3"/>
  <line x1="286" y1="370" x2="504" y2="330" stroke="#0969da" stroke-width="3"/>
  <text x="395" y="398" font-size="12" fill="#57606a" text-anchor="middle">RX and TX are crossed</text>

  <!-- boot jumper, first flash only -->
  <path d="M 286 210 C 340 210, 340 170, 286 170" fill="none" stroke="#bf8700" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="345" y="196" font-size="12" fill="#9a6700">bridge 1–2 only for</text>
  <text x="345" y="211" font-size="12" fill="#9a6700">the first flash</text>

  <text x="30" y="465" font-size="13" fill="#57606a">Identify pin 1 from the marking on your board before connecting power.</text>
  <text x="30" y="485" font-size="13" fill="#57606a">Later flashes need no bridge: the firmware's <tspan font-family="ui-monospace, Menlo, monospace">dfu</tspan> command enters download mode.</text>
</svg>
