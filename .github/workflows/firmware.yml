name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config python3-venv

      # The Rust toolchain (pinned nightly + rust-src) comes from rust-toolchain.toml;
      # rustup installs it on first use. ESP-IDF is downloaded by esp-idf-sys into
      # ~/.espressif (ESP_IDF_TOOLS_INSTALL_DIR = "global" in .cargo/config.toml).
      - name: Cache ESP-IDF, cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            ~/.cargo/git
            target
            stock-installer/target
          key: firmware-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'sdkconfig.defaults', '.cargo/config.toml', 'components_esp32c6.lock', 'partitions.csv', 'stock-installer/Cargo.lock', 'stock-installer/sdkconfig.defaults', 'stock-installer/partitions.csv') }}
          restore-keys: firmware-${{ runner.os }}-

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build tools
        uses: taiki-e/install-action@v2
        with:
          tool: ldproxy,cargo-espflash@4.7.0

      - name: Build
        run: cargo build --release

      - name: Firmware images
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="$GITHUB_REF_NAME"; else VER="$(git rev-parse --short HEAD)"; fi
          mkdir -p dist
          common=(--release --chip esp32c6 --flash-size 8mb --partition-table partitions.csv)
          # App image: firmware update through the setup portal (or espflash).
          cargo espflash save-image "${common[@]}" "dist/shelly-hue-fan-$VER-app.bin"
          # Full 8 MB image: bootloader + partition table + app, everything else
          # blank. Written at 0x0 it replaces the stock firmware in one step.
          cargo espflash save-image "${common[@]}" --merge "dist/shelly-hue-fan-$VER-full.bin"
          (cd dist && sha256sum ./*.bin > SHA256SUMS)
          ls -l dist
          echo "VER=$VER" >> "$GITHUB_ENV"

      # Package for installing from Shelly's own web UI (stock-installer/).
      # Not attached to releases until it has been tested on a device.
      - name: Stock-firmware installer
        run: |
          mkdir -p installer
          python3 tools/make-stock-installer.py \
            --full "dist/shelly-hue-fan-$VER-full.bin" --app "dist/shelly-hue-fan-$VER-app.bin" \
            --version "$VER" --out "installer/shelly-hue-fan-$VER-stock-installer-S1PMG4.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: shelly-hue-fan-${{ env.VER }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: shelly-hue-fan-${{ env.VER }}-stock-installer
          path: installer/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shelly-hue-fan-${{ github.ref_name }}
          path: dist

      # Created as a draft: review the notes and files, then publish by hand.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
